<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        body { font-family: 'Vazirmatn', sans-serif; background: #f8fafc; }
        .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- سایدبار: انتخاب پایه -->
    <aside class="w-72 p-6 gradient-bg text-white shadow-2xl m-4 rounded-3xl">
        <h1 class="text-2xl font-black mb-10 text-center">AfzaliMATH</h1>
        <div id="grade-list" class="space-y-3">
            <button onclick="renderChapters('seventh')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">هفتم ✨</button>
            <button onclick="renderChapters('eighth')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">هشتم 🚀</button>
            <button onclick="renderChapters('ninth')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">نهم 💎</button>
        </div>
    </aside>

    <!-- محتوای اصلی -->
    <main class="flex-1 p-10">
        <h2 id="view-title" class="text-3xl font-bold text-slate-800 mb-8">لطفاً پایه را انتخاب کن</h2>
        <div id="content-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- اینجا محتوا به صورت پویا ساخته می‌شه -->
        </div>
    </main>

    <script>
        // دیتابیسِ درختیِ تو
        const curriculum = {
            seventh: { title: "ریاضی هفتم", chapters: Array.from({length: 9}, (_, i) => ({
                title: `فصل ${i+1}`,
                lessons: Array.from({length: 4}, (_, j) => ({ title: `درس ${j+1}`, pdf: "file.pdf", video: "url", game: "url" }))
            }))},
            // می‌تونی هشتم و نهم رو هم با همین ساختار اضافه کنی
        };

        // ۱. نمایش فصل‌ها
        function renderChapters(gradeKey) {
            const data = curriculum[gradeKey];
            document.getElementById('view-title').innerText = data.title + ": انتخاب فصل";
            let html = data.chapters.map((ch, i) => `
                <button onclick="renderLessons('${gradeKey}', ${i})" class="bg-white p-6 rounded-2xl shadow-lg border-b-4 border-indigo-500 hover:scale-105 transition">
                    ${ch.title}
                </button>
            `).join('');
            document.getElementById('content-container').innerHTML = html;
        }

        // ۲. نمایش درس‌ها
        function renderLessons(gradeKey, chapterIndex) {
            const chapter = curriculum[gradeKey].chapters[chapterIndex];
            document.getElementById('view-title').innerText = chapter.title + ": انتخاب درس";
            let html = chapter.lessons.map((lesson, j) => `
                <button onclick="renderContent('${gradeKey}', ${chapterIndex}, ${j})" class="bg-white p-6 rounded-2xl shadow-lg border-b-4 border-purple-500 hover:scale-105 transition">
                    ${lesson.title}
                </button>
            `).join('');
            document.getElementById('content-container').innerHTML = html;
        }

        // ۳. نمایش گاوصندوق محتوا
        function renderContent(gradeKey, cIndex, lIndex) {
            const lesson = curriculum[gradeKey].chapters[cIndex].lessons[lIndex];
            document.getElementById('view-title').innerText = lesson.title + ": محتوا";
            document.getElementById('content-container').innerHTML = `
                <div class="col-span-3 bg-white p-8 rounded-3xl shadow-xl">
                    <h3 class="text-xl mb-4">محتوای آموزشی:</h3>
                    <div class="flex gap-4">
                        <button class="bg-indigo-500 text-white px-4 py-2 rounded-lg">📄 جزوه PDF</button>
                        <button class="bg-purple-500 text-white px-4 py-2 rounded-lg">🎥 فیلم آموزشی</button>
                        <button class="bg-yellow-500 text-white px-4 py-2 rounded-lg">🎮 بازی تمرینی</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
