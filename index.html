<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex">

    <!-- سایدبار حرفه‌ای -->
    <aside class="w-72 bg-slate-900 text-slate-200 p-6 flex flex-col justify-between">
        <div>
            <h1 class="text-2xl font-black text-white mb-10 tracking-tighter">Afzali<span class="text-indigo-400">MATH</span></h1>
            <nav class="space-y-3">
                <button class="w-full text-right p-3 rounded-lg hover:bg-slate-800 transition">خانه</button>
                <!-- انتخاب پایه -->
                <div class="pt-4 border-t border-slate-700">
                    <p class="text-xs text-slate-500 mb-2 px-3 uppercase tracking-wider">پایه‌ها</p>
                    <button class="w-full text-right p-3 rounded-lg hover:bg-slate-800">پایه هفتم</button>
                    <button class="w-full text-right p-3 rounded-lg hover:bg-slate-800">پایه هشتم</button>
                    <button class="w-full text-right p-3 rounded-lg hover:bg-slate-800">پایه نهم</button>
                </div>
            </nav>
        </div>
        <!-- دکمه ادمین (مخفی برای دانش‌آموز) -->
        <button class="text-sm text-slate-500 hover:text-white transition">پنل مدیریت</button>
    </aside>

    <!-- منطقه محتوا -->
    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-bold text-slate-800">داشبورد ریاضی</h2>
            <div class="bg-white px-4 py-2 rounded-full shadow-sm border border-slate-200 text-sm">
                سلام، کاربر عزیز 👋
            </div>
        </header>

        <!-- بخشِ اصلی نمایش محتوا -->
        <div id="content-view" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- کارت‌های نمونه -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                <h3 class="font-bold text-lg mb-2">جزوات آموزشی</h3>
                <p class="text-slate-500 text-sm">مشاهده جزوات فصل اول تا آخر</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                <h3 class="font-bold text-lg mb-2">فیلم‌های آموزشی</h3>
                <p class="text-slate-500 text-sm">تدریسِ مفهومی مباحث</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                <h3 class="font-bold text-lg mb-2">تمرین و بازی</h3>
                <p class="text-slate-500 text-sm">تمرینِ تعاملی ریاضی</p>
            </div>
        </div>
    </main>

</body>
</html>
