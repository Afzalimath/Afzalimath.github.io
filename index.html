<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>افزالی‌مَث | پلتفرم تخصصی ریاضیات</title>
  
  <!-- کتابخانه‌ها -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
    body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>

  <!-- ساختار اصلی سایت -->
  <div class="max-w-4xl mx-auto p-8">
    <h1 class="text-3xl font-black mb-6">به افزالی‌مَث خوش آمدید</h1>
    <p class="text-slate-600 mb-6">پلتفرم هوشمند آموزش ریاضیات</p>
    
    <!-- دکمه‌ها برای تست اتصال -->
    <button id="test-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700 transition">
      تست اتصال به دیتابیس
    </button>
  </div>

  <script>
    // تنظیمات Supabase
    const SUPABASE_URL = "https://msoovfnbkgdqxvftlkl.supabase.co";
    const SUPABASE_ANON_KEY = "GAPGPTMASKTOKENy7b0p7g8sxrX1X";

    // راه‌اندازی کلاینت
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // دکمه تست برای اطمینان از عملکرد
    document.getElementById('test-btn').addEventListener('click', async () => {
      try {
        const { data, error } = await supabase.from('test_table').select('*').limit(1);
        if (error) {
          console.error("خطا در اتصال:", error.message);
          alert("اتصال برقرار نشد، اما کلید جایگذاری شد.");
        } else {
          alert("اتصال با موفقیت برقرار شد!");
        }
      } catch (err) {
        alert("خطای سیستم.");
      }
    });

    console.log("پروژه افزالی‌مَث آماده است!");
  </script>
</body>
</html>
