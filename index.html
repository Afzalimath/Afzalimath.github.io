<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        body { font-family: 'Vazirmatn', sans-serif; background: #f8fafc; }
        .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- سایدبار شاد و مدرن -->
    <aside class="w-72 p-6 flex flex-col gradient-bg text-white shadow-2xl m-4 rounded-3xl">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-black italic tracking-tighter">Afzali<span class="text-yellow-300">MATH</span></h1>
            <p class="text-xs opacity-70 mt-1">آکادمی ریاضیات هوشمند</p>
        </div>
        
        <nav class="space-y-3 flex-1">
            <button class="w-full flex items-center p-4 rounded-2xl bg-white/10 hover:bg-white/20 transition backdrop-blur-sm">
                🏠 داشبورد
            </button>
            <div class="pt-6">
                <p class="text-[10px] font-bold uppercase tracking-widest opacity-50 mb-3 px-4">انتخاب پایه</p>
                <button class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">هفتم ✨</button>
                <button class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">هشتم 🚀</button>
                <button class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">نهم 💎</button>
            </div>
        </nav>

        <button class="text-xs opacity-50 hover:opacity-100 transition">⚙️ پنل مدیریت</button>
    </aside>

    <!-- محتوای اصلی -->
    <main class="flex-1 p-10 overflow-y-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-4xl font-extrabold text-slate-800">سلام قهرمان! 👋</h2>
                <p class="text-slate-500 mt-2">امروز می‌خوایم چه مبحثی رو یاد بگیریم؟</p>
            </div>
            <div class="w-16 h-16 rounded-full bg-indigo-100 border-4 border-white shadow-lg flex items-center justify-center">
                🧠
            </div>
        </header>

        <!-- کارت‌های محتوا با استایلِ کارتونی/مدرن -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- کارت اول -->
            <div class="group bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-300 hover:-translate-y-3 border-b-4 border-indigo-500">
                <div class="text-4xl mb-4">📄</div>
                <h3 class="font-bold text-xl text-slate-800 mb-2">جزوات PDF</h3>
                <p class="text-slate-500 text-sm">جزواتِ کاملاً رنگی و دست‌نویس</p>
            </div>
            
            <!-- کارت دوم -->
            <div class="group bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-300 hover:-translate-y-3 border-b-4 border-purple-500">
                <div class="text-4xl mb-4">🎥</div>
                <h3 class="font-bold text-xl text-slate-800 mb-2">فیلم آموزشی</h3>
                <p class="text-slate-500 text-sm">ویدیوهایِ تعاملی و جذاب</p>
            </div>

            <!-- کارت سوم -->
            <div class="group bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-300 hover:-translate-y-3 border-b-4 border-yellow-500">
                <div class="text-4xl mb-4">🎮</div>
                <h3 class="font-bold text-xl text-slate-800 mb-2">بازی و تمرین</h3>
                <p class="text-slate-500 text-sm">محیطی برای چالش‌های ریاضی</p>
            </div>
        </div>
    </main>

</body>
</html>
