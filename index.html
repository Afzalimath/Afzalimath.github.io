<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        body { font-family: 'Vazirmatn', sans-serif; background: #f8fafc; }
        .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- سایدبار (ثابت) -->
    <aside class="w-72 p-6 flex flex-col gradient-bg text-white shadow-2xl m-4 rounded-3xl">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-black italic tracking-tighter">Afzali<span class="text-yellow-300">MATH</span></h1>
        </div>
        
        <nav class="space-y-3 flex-1">
            <p class="text-[10px] font-bold uppercase tracking-widest opacity-50 mb-3 px-4">انتخاب پایه</p>
            <button onclick="loadGrade('seventh')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">هفتم ✨</button>
            <button onclick="loadGrade('eighth')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">هشتم 🚀</button>
            <button onclick="loadGrade('ninth')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">نهم 💎</button>
        </nav>
    </aside>

    <!-- محتوای اصلی -->
    <main class="flex-1 p-10">
        <!-- هدر -->
        <header class="mb-8">
            <h2 id="grade-title" class="text-4xl font-extrabold text-slate-800">خوش آمدی قهرمان!</h2>
            <p id="grade-desc" class="text-slate-500 mt-2">لطفاً ابتدا پایه تحصیلی را از سمت راست انتخاب کن.</p>
        </header>

        <!-- دکمه‌های انتخاب محتوا -->
        <div class="flex gap-4 mb-8">
            <button onclick="openVault('pdf')" class="px-6 py-3 bg-indigo-500 text-white rounded-xl hover:bg-indigo-600 transition">📄 مشاهده جزوه</button>
            <button onclick="openVault('video')" class="px-6 py-3 bg-purple-500 text-white rounded-xl hover:bg-purple-600 transition">🎥 ویدیو آموزشی</button>
            <button onclick="openVault('game')" class="px-6 py-3 bg-yellow-500 text-white rounded-xl hover:bg-yellow-600 transition">🎮 بازی ریاضی</button>
        </div>

        <!-- گاوصندوق محتوا -->
        <div id="content-vault" class="bg-white p-8 rounded-3xl shadow-2xl min-h-[400px] border-t-8 border-slate-200">
            <p class="text-slate-400 text-center mt-20">هنوز محتوایی انتخاب نشده...</p>
        </div>
    </main>

    <script>
        // دیتای پایه
        const appData = {
            seventh: { title: "ریاضیات پایه هفتم", desc: "شروع ماجراجویی ریاضی!" },
            eighth: { title: "ریاضیات پایه هشتم", desc: "قدم‌های محکم‌تر در ریاضی!" },
            ninth: { title: "ریاضیات پایه نهم", desc: "فتح قله‌های هندسه!" }
        };

        // ویوِرهای امن
        const viewers = {
            pdf: `<div class="text-center"><h3 class="text-2xl mb-4 font-bold">📖 نمایشگرِ جزوه</h3><div class="h-64 bg-slate-100 flex items-center justify-center rounded-2xl border-2 border-dashed border-slate-300">اینجا قراره PDF.js رندر بشه</div></div>`,
            video: `<div class="text-center"><h3 class="text-2xl mb-4 font-bold">🎥 پلیرِ درس</h3><div class="h-64 bg-black rounded-2xl flex items-center justify-center text-white">پخش‌کننده HLS محافظت شده</div></div>`,
            game: `<div class="text-center"><h3 class="text-2xl mb-4 font-bold">🎮 محیطِ بازی</h3><iframe sandbox="allow-scripts" class="w-full h-64 rounded-2xl" src="about:blank"></iframe></div>`
        };

        // توابع اصلی
        function loadGrade(gradeKey) {
            const data = appData[gradeKey];
            document.getElementById('grade-title').innerText = data.title;
            document.getElementById('grade-desc').innerText = data.desc;
            document.getElementById('content-vault').innerHTML = '<p class="text-center mt-20 text-slate-400">حالا نوع محتوا را انتخاب کن...</p>';
        }

        function openVault(type) {
            const vault = document.getElementById('content-vault');
            vault.innerHTML = viewers[type];
        }
    </script>
</body>
</html>
