<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfzaliMATH | سیستم آموزشی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f1f5f9; }
        .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- سایدبار -->
    <aside class="w-72 p-6 gradient-bg text-white shadow-2xl m-4 rounded-3xl flex flex-col">
        <h1 class="text-3xl font-black mb-10 text-center">AfzaliMATH</h1>
        <div id="grade-list" class="space-y-4 flex-1">
            <button onclick="renderChapters('seventh')" class="w-full text-right p-4 rounded-2xl bg-white/10 hover:bg-white/20 transition font-bold">ریاضی هفتم ✨</button>
            <button onclick="renderChapters('eighth')" class="w-full text-right p-4 rounded-2xl bg-white/10 hover:bg-white/20 transition font-bold">ریاضی هشتم 🚀</button>
            <button onclick="renderChapters('ninth')" class="w-full text-right p-4 rounded-2xl bg-white/10 hover:bg-white/20 transition font-bold">ریاضی نهم 💎</button>
        </div>
        <button onclick="location.reload()" class="mt-auto w-full text-center p-3 rounded-xl bg-red-500/20 hover:bg-red-500/40 transition">بازگشت به خانه</button>
    </aside>

    <!-- محتوای اصلی -->
    <main class="flex-1 p-10 overflow-y-auto">
        <div class="mb-8">
            <h2 id="view-title" class="text-3xl font-extrabold text-slate-800">به پنل آموزشی خوش آمدید</h2>
            <p id="view-subtitle" class="text-slate-500 mt-2">یک پایه تحصیلی را از سمت راست انتخاب کنید.</p>
        </div>
        
        <div id="content-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center p-20 text-slate-400">
                <p class="text-xl">آماده شروع یادگیری؟</p>
            </div>
        </div>
    </main>

    <script>
        const curriculum = {
            seventh: { title: "ریاضی هفتم", chapters: 9 },
            eighth: { title: "ریاضی هشتم", chapters: 9 },
            ninth: { title: "ریاضی نهم", chapters: 8 }
        };

        function renderChapters(gradeKey) {
            const data = curriculum[gradeKey];
            document.getElementById('view-title').innerText = data.title;
            document.getElementById('view-subtitle').innerText = "انتخاب فصل:";
            
            let html = "";
            for(let i=1; i <= data.chapters; i++) {
                html += `<button onclick="renderLessons('${gradeKey}', ${i})" class="bg-white p-6 rounded-2xl shadow-md border-b-4 border-indigo-400 hover:scale-105 transition text-center font-bold text-slate-700">فصل ${i}</button>`;
            }
            document.getElementById('content-container').innerHTML = html;
        }

        function renderLessons(gradeKey, chapterNum) {
            document.getElementById('view-title').innerText = `فصل ${chapterNum}`;
            document.getElementById('view-subtitle').innerText = "انتخاب درس:";
            
            let html = "";
            for(let j=1; j <= 4; j++) {
                html += `<button onclick="showViewer('${gradeKey}', ${chapterNum}, ${j})" class="bg-white p-6 rounded-2xl shadow-md border-b-4 border-purple-400 hover:scale-105 transition text-center font            document.getElementById('view-title').innerText = `فصل ${chapterNum}`;
            document.getElementById('view-subtitle').innerText = "انتخاب درس:";
            
            let html = "";
            for(let j=1; j <= 4; j++) {
                html += `<button onclick="showViewer('${gradeKey}', ${chapterNum}, ${j})" class="bg-white p-6 rounded-2xl shadow-md border-b-4 border-purple-400 hover:scale-105 transition text-center font-bold text-slate-700">درس ${j}</button>`;
            }
            document.getElementById('content-container').innerHTML = html;
        }

        function showViewer(grade, chapter, lesson) {
            document.getElementById('view-title').innerText = `فصل ${chapter} - درس ${lesson}`;
            document.getElementById('view-subtitle').innerText = "محتوای آموزشی را انتخاب کنید:";
            
            document.getElementById('content-container').innerHTML = `
                <div class="col-span-full bg-white p-8 rounded-3xl shadow-xl border-t-8 border-indigo-500">
                    <div class="flex gap-4 mb-8 flex-wrap">
                        <button onclick="loadContent('pdf', 'path/to/pdf')" class="bg-indigo-500 text-white px-6 py-3 rounded-xl hover:bg-indigo-600 transition shadow-lg">📄 جزوه PDF</button>
                        <button onclick="loadContent('video', 'https://www.youtube.com/embed/dQw4w9WgXcQ')" class="bg-purple-500 text-white px-6 py-3 rounded-xl hover:bg-purple-600 transition shadow-lg">🎥 فیلم آموزشی</button>
                        <button onclick="loadContent('app', 'apps/my_game.html')" class="bg-emerald-500 text-white px-6 py-3 rounded-xl hover:bg-emerald-600 transition shadow-lg">🎮 بازیtype === 'pdf') {
                area.innerHTML = `<iframe src="${source}" class="w-full h-full"></iframe>`;
            } else if (type === 'video') {
                area.innerHTML = `<iframe src="${source}" class="w-full h-full" allowfullscreen></iframe>`;
            } else if (type === 'app') {
                area.innerHTML = `<iframe src="${source}" class="w-full h-full"></iframe>`;
            }
        }
    </script>
</body>
</html>
