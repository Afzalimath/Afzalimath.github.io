<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>َAfzaliMath | پلتفرم تخصصی ریاضیات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Header -->
    <header class="bg-white shadow-sm p-6 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-2xl font-black text-indigo-700">افزالی‌مَث</h1>
        <div class="flex gap-4">
            <button onclick="document.getElementById('login-modal').classList.remove('hidden')" 
                    class="font-bold text-slate-600">ورود</button>
            <button class="bg-indigo-600 text-white px-5 py-2 rounded-xl font-bold">ثبت‌نام</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="max-w-6xl mx-auto py-16 px-6 grid md:grid-cols-2 gap-12 items-center">
        <div>
            <h2 class="text-4xl font-black leading-tight mb-6">یادگیری هوشمند ریاضیات از پایه تا کنکور</h2>
            <p class="text-lg text-slate-600 mb-8">با افزالی‌مَث، مفاهیم ریاضی را مفهومی و عمیق یاد بگیرید.</p>
        </div>
        <div class="flex justify-center">
            <!-- تصویر دانش آموز -->
            <img src="student.png" alt="دانش‌آموز" class="w-full max-w-sm rounded-3xl shadow-2xl">
        </div>
    </section>

    <!-- Sections (Grades & Professors) -->
    <section class="max-w-6xl mx-auto px-6 py-10">
        <h3 class="text-2xl font-black mb-8">انتخاب مقطع تحصیلی</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow border text-center font-bold">ابتدایی</div>
            <div class="bg-white p-6 rounded-2xl shadow border text-center font-bold">متوسطه اول</div>
            <div class="bg-white p-6 rounded-2xl shadow border text-center font-bold">متوسطه دوم</div>
            <div class="bg-white p-6 rounded-2xl shadow border text-center font-bold">کنکور</div>
        </div>
    </section>

    <!-- Login Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm shadow-2xl">
            <h3 class="text-xl font-bold mb-6">ورود به حساب کاربری</h3>
            <input id="email" type="email" placeholder="ایمیل" class="w-full border p-4 rounded-xl mb-4">
            <input id="password" type="password" placeholder="رمز عبور" class="w-full border p-4 rounded-xl mb-6">
            <button onclick="loginUser()" class="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold">ورود</button>
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" 
                    class="w-full text-slate-400 mt-4 text-sm">انصراف</button>
        </div>
    </div>

    <!-- Script -->
    <script>
        const SUPABASE_URL = "https://msoovfnbkgdqxvftlkl.supabase.co";
        // ⚠️ فقط کلید خود را اینجا جایگذاری کنید ⚠️
        const SUPABASE_ANON_KEY = "sb_publishable_ji8Qt0wzbNKwLScCjt4UEw_X2VZSLc1"; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { error } = await supabase.auth.signInWithPassword({ 
                email: email, 
                password: password 
            });
            
            if (error) {
                alert("خطا: " + error.message);
            } else {
                alert("با موفقیت وارد شدید!");
                document.getElementById('login-modal').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
