<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آموزش نوین ریاضی | پلتفرم تخصصی ریاضیات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap');
    body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- نوار بالای سایت -->
  <header class="sticky top-0 z-50 glass border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg shadow-indigo-200">∑</div>
        <div>
          <h1 class="text-xl font-black text-indigo-950">آموزش نوین ریاضی</h1>
          <p class="text-xs text-slate-500 font-bold">AfzaliMath</p>
        </div>
      </div>
      <div id="auth-guest" class="flex items-center gap-2">
        <button onclick="openModal('login-modal')" class="px-4 py-2 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-xl hover:bg-indigo-100 transition">ورود</button>
        <button onclick="openModal('signup-modal')" class="px-4 py-2 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition">ثبت‌نام</button>
      </div>
      <div id="auth-user" class="hidden flex items-center gap-3">
        <span id="user-display" class="text-sm font-bold text-indigo-700"></span>
        <button onclick="logout()" class="px-3 py-1.5 text-xs font-bold text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition">خروج</button>
      </div>
    </div>
  </header>

  <!-- بخش معرفی با تصویر -->
  <section class="max-w-7xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
    <div>
      <h2 class="text-3xl md:text-5xl font-black text-slate-900 leading-tight">ریاضیات را مفهومی و لذت‌بخش یاد بگیرید!</h2>
      <p class="text-slate-600 mt-6 text-base md:text-lg leading-relaxed">
        پلتفرم تخصصی آموزش ریاضیات از ابتدایی تا کنکور، همراه با ابزارهای تعاملی، آزمون‌های هوشمند و اساتید مجرب.
      </p>
    </div>
    <div class="flex justify-center">
      <!-- اینجا نام فایل عکس خود را جایگزین کنید -->
      <img src="student.png" alt="آموزش ریاضی" class="rounded-3xl shadow-2xl w-full max-w-md hover:scale-105 transition-transform duration-500">
    </div>
  </section>

  <!-- بقیه بخش‌ها (پایه‌ها و مودال‌ها ثابت است) -->
  <!-- ... (بقیه کدهای قبلی را اینجا قرار دهید) ... -->
  
  <script>
    // ... اسکریپت‌های لاگین و Supabase ...
    // فراموش نکنید که checkUserSession() را فراخوانی کنید
  </script>
</body>
</html>
