<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>افزالی‌مَث | پنل مدیریت اختصاصی</title>
    <!-- کتابخانه‌های مورد نیاز -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f1f5f9; }
        .bento-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .bento-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header & Nav -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <h1 class="font-black text-2xl text-indigo-700">افزالی‌مَث</h1>
            
            <div id="auth-container">
                <!-- دکمه ورود (نمایش در حالت عادی) -->
                <button id="btn-login-open" onclick="document.getElementById('modal-login').classList.remove('hidden')" 
                        class="px-5 py-2 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition">ورود مدیر</button>
                
                <!-- وضعیت لاگین (نمایش بعد از ورود) -->
                <div id="admin-status" class="hidden flex items-center gap-4">
                    <span class="text-xs font-bold text-green-600 bg-green-50 px-3 py-1 rounded-full">مدیریت فعال</span>
                    <button onclick="logout()" class="text-sm font-bold text-red-600 hover:text-red-700 transition">خروج</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- بخش ابتدایی -->
            <section class="bento-card bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                <h2 class="text-xl font-black mb-6 border-b pb-4">محتوای مقطع ابتدایی</h2>
                <div id="list-elementary" class="space-y-3">
                    <p class="text-slate-400 italic text-sm">منتظر بارگذاری داده‌ها...</p>
                </div>
            </section>

            <!-- بخش متوسطه -->
            <section class="bento-card bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                <h2 class="text-xl font-black mb-6 border-b pb-4">محتوای مقطع متوسطه</h2>
                <div id="list-secondary" class="space-y-3">
                    <p class="text-slate-400 italic text-sm">منتظر بارگذاری داده‌ها...</p>
                </div>
            </section>

        </div>
    </main>

    <!-- Login Modal -->
    <div id="modal-login" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
            <h3 class="text-xl font-black mb-6 text-slate-800">ورود به پنل مدیریت</h3>
            <input type="email" id="email" placeholder="ایمیل" class="w-full p-4 bg-slate-50 rounded-xl mb-3 border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
            <input type="password" id="password" placeholder="رمز عبور" class="w-full p-4 bg-slate-50 rounded-xl mb-6 border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="loginAdmin()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition">تایید</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // ۱. جایگذاری کلیدهای سوپابیس (از پنل Supabase بخش API بردار)
        const URL = "https://msoovfnbkgdqxvftlkl.supabase.co";
        const KEY = "YOUR_SUPABASE_ANON_KEY_HERE"; 
        
        const db = supabase.createClient(URL, KEY);

        // لاگین مدیر
        async function loginAdmin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await db.auth.signInWithPassword({ email, password });
            
            if (error) alert("خطا در ورود: " + error.message);
            else { alert("خوش آمدید مدیر!"); location.reload(); }
        }

        // خروج
        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        // بارگذاری محتوا
        async function loadContent() {
            const elElem = document.getElementById('list-elementary');
            const elSec = document.getElementById('list-secondary');

            // TODO: کوئری سوپابیس را اینجا بنویس
            // const { data, error } = await db.from('courses').select('*');
            
            elElem.innerHTML = "<div class='p-3 bg-slate-50 rounded-lg'>درس اول: اعداد طبیعی</div><div class='p-3 bg-slate-50 rounded-lg'>درس دوم: کسرها</div>";
            elSec.innerHTML = "<div class='p-3 bg-slate-50 rounded-lg'>درس اول: جبر</div><div class='p-3 bg-slate-50 rounded-lg'>درس دوم: هندسه</div>";
        }

        // چک کردن وضعیت لاگین هنگام لود شدن صفحه
        async function checkSession() {
            const { data: { user } } = await db.auth.getUser();
            if (user) {
                document.getElementById('btn-login-open').classList.add('hidden');
                document.getElementById('admin-status').classList.remove('hidden');
                loadContent();
            }
        }

        checkSession();
    </script>
</body>
</html>
