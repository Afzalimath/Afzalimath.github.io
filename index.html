<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfzaliMATH | سیستم هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f1f5f9; }
        .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        
        /* افکت نرم Fade-in */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- سایدبار -->
    <aside class="w-72 p-6 gradient-bg text-white shadow-2xl m-4 rounded-3xl flex flex-col">
        <h1 class="text-3xl font-black mb-10 text-center cursor-pointer" onclick="renderHome()">AfzaliMATH</h1>
        <div id="grade-list" class="space-y-4 flex-1">
            <button onclick="renderChapters('seventh')" class="w-full text-right p-4 rounded-2xl bg-white/10 hover:bg-white/20 transition font-bold">ریاضی هفتم ✨</button>
            <button onclick="renderChapters('eighth')" class="w-full text-right p-4 rounded-2xl bg-white/10 hover:bg-white/20 transition font-bold">ریاضی هشتم 🚀</button>
            <button onclick="renderChapters('ninth')" class="w-full text-right p-4 rounded-2xl bg-white/10 hover:bg-white/20 transition font-bold">ریاضی نهم 💎</button>
        </div>
        <button onclick="renderHome()" class="mt-auto w-full text-center p-3 rounded-xl bg-red-500/20 hover:bg-red-500/40 transition">بازگشت به خانه</button>
    </aside>

    <!-- محتوای اصلی -->
    <main class="flex-1 p-10 overflow-y-auto">
        <div class="mb-8">
            <h2 id="view-title" class="text-3xl font-extrabold text-slate-800">به پنل آموزشی خوش آمدید</h2>
            <p id="view-subtitle" class="text-slate-500 mt-2">یک پایه تحصیلی را از سمت راست انتخاب کنید.</p>
        </div>
        
        <!-- کانتینر اصلی -->
        <div id="content-container" class="flex flex-col items-center justify-center min-h-[600px] bg-white rounded-3xl p-10 shadow-lg fade-in">
            <img src="student.png" alt="Student" class="w-[600px] h-[600px] object-cover rounded-3xl shadow-2xl mb-8 border-[12px] border-indigo-50">
            <div class="text-center space-y-3 max-w-xl">
                <h3 class="text-3xl font-black text-slate-800">آماده‌ی فتحِ قله‌های ریاضی هستی؟ 🌟</h3>
                <p class="text-slate-500 text-lg">هر مسئله‌ای که حل می‌کنی، یک پله بالاتر می‌روی. <span class="font-bold text-indigo-600">پایه خودت را انتخاب کن تا شروع کنیم!</span></p>
            </div>
        </div>
    </main>

    <script>
        const curriculum = {
            seventh: { title: "ریاضی هفتم", chapters: 9 },
            eighth: { title: "ریاضی هشتم", chapters: 9 },
            ninth: { title: "ریاضی نهم", chapters: 8 }
        };

        function renderHome() {
            document.getElementById('view-title').innerText = "به پنل آموزشی خوش آمدید";
            document.getElementById('view-subtitle').innerText = "یک پایه تحصیلی را از سمت راست انتخاب کنید.";
            document.getElementById('content-container').className = "flex flex-col items-center justify-center min-h-[600px] bg-white rounded-3xl p-10 shadow-lg fade-in";
            document.getElementById('content-container').innerHTML = `
                <img src="student.png" alt="Student" class="w-[600px] h-[600px] object-cover rounded-3xl shadow-2xl mb-8 border-[12px] border-indigo-50">
                <div class="text-center space-y-3 max-w-xl">
                    <h3 class="text-3xl font-black text-slate-800">آماده‌ی فتحِ قله‌های ریاضی هستی؟ 🌟</h3>
                    <p class="text-slate-500 text-lg">هر مسئله‌ای که حل می‌کنی، یک پله بالاتر می‌روی. <span class="font-bold text-indigo-600">پایه خودت را انتخاب کن تا شروع کنیم!</span></p>
                </div>
            `;
        }

        function renderChapters(gradeKey) {
            const data = curriculum[gradeKey];
            document.getElementById('view-title').innerText = data.title;
            document.getElementById('view-subtitle').innerText = "انتخاب فصل:";
            
            let html = `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 w-full">`;
            for(let i=1; i <= data.chapters; i++) {
                html += `<button onclick="renderLessons('${gradeKey}', ${i})" class="bg-indigo-50 p-6 rounded-2xl shadow-sm border-2 border-indigo-200 hover:bg-indigo-100 transition text-center font-bold text-slate-700">فصل ${i}</button>`;
            }
            html += `</div>`;
            document.getElementById('content-container').className = "grid w-full fade-in";
            document.getElementById('content-container').innerHTML = html;
        }

        function renderLessons(gradeKey, chapterNum) {
            document.getElementById('view-title').innerText = `فصل ${chapterNum}`;
            document.getElementById('view-subtitle').innerText = "انتخاب درس:";
            
            let html = `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 w-full">`;
            for(let j=1; j <= 4; j++) {
                html += `<button onclick="showViewer('${gradeKey}', ${chapterNum}, ${j})" class="bg-purple-50 p-6 rounded-2xl shadow-sm border-2 border-purple-200 hover:bg-purple-100 transition text-center font-bold text-slate-700">درس ${j}</button>`;
            }
            html += `</div>`;
            document.getElementById('content-container').className = "grid w-full fade-in";
            document.getElementById('content-container').innerHTML = html;
        }

        function showViewer(grade, chapter, lesson) {
            document.getElementById('view-title').innerText = `فصل ${chapter} - درس ${lesson}`;
            document.getElementById('view-subtitle').innerText = "محتوای آموزشی:";
            
            document.getElementById('content-container').className = "w-full fade-in";
            document.getElementById('content-container').innerHTML = `
                <div class="w-full h-full space-y-6">
                    <div class="flex gap-4 flex-wrap">
                        <button onclick="loadContent('pdf', 'path/to/your/pdf.pdf')" class="bg-indigo-500 text-white px-6 py-3 rounded-xl hover:bg-indigo-600 transition shadow-lg font-bold">📄 جزوه PDF</button>
                        <button onclick="loadContent('video', 'https://www.aparat.com/video/video/embed/videohash/YOUR_VIDEO_HASH/vt/frame')" class="bg-purple-500 text-white px-6 py-3 rounded-xl hover:bg-purple-600 transition shadow-lg font-bold">🎥 فیلم آموزشی</button>
                        <button onclick="loadContent('app', 'apps/interactive.html')" class="bg-emerald-500 text-white px-6 py-3 rounded-xl hover:bg-emerald-600 transition shadow-lg font-bold">🎮 بازی و اپلیکیشن</button>
                    </div>
                    <div id="viewer-area" class="h-[480px] w-full bg-slate-100 rounded-2xl flex items-center justify-center border-2 border-dashed border-slate-300 overflow-hidden">
                        <p class="text-slate-400 font-bold">یکی از دکمه‌های بالا را برای مشاهده محتوا انتخاب کنید.</p>
                    </div>
                </div>
            `;
        }

        function loadContent(type, source) {
            const area = document.getElementById('viewer-area');
            if (source.includes('path/to/your') || source.includes('YOUR_VIDEO_HASH')) {
                area.innerHTML = `<div class="text-center p-10"><p class="text-amber-600 font-bold mb-2">محتوا هنوز متصل نشده است</p><p class="text-slate-500 text-sm">مسیر فایل یا لینک مربوطه را در کد قرار دهید.</p></div>`;
            } else {
                area.innerHTML = `<iframe src="${source}" class="w-full h-full border-0 rounded-2xl"></iframe>`;
            }
        }
    </script>
</body>
</html>
