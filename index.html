<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>افزالی‌مَث | پلتفرم تخصصی ریاضیات</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap');
    body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-black">∑</div>
        <h1 class="text-xl font-black text-indigo-950">افزالی‌مَث</h1>
      </div>
      <div id="auth-guest" class="flex items-center gap-2">
        <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="px-4 py-2 text-sm font-bold text-indigo-600 hover:bg-indigo-50 rounded-xl">ورود</button>
        <button onclick="document.getElementById('signup-modal').classList.remove('hidden')" class="px-4 py-2 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700">ثبت‌نام</button>
      </div>
      <div id="auth-user" class="hidden flex items-center gap-3">
        <span id="user-display" class="text-sm font-bold text-indigo-700"></span>
        <button onclick="logout()" class="px-3 py-1.5 text-xs font-bold text-red-600 bg-red-50 rounded-lg">خروج</button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="max-w-7xl mx-auto px-4 py-12 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
    <div>
      <h2 class="text-4xl md:text-5xl font-black text-slate-900 leading-tight">ریاضیات را مفهومی و لذت‌بخش یاد بگیرید!</h2>
      <p class="text-slate-600 mt-6 text-lg">آموزش تخصصی از ابتدایی تا کنکور با اساتید مجرب.</p>
    </div>
    <div class="flex justify-center">
      <!-- دقت کنید نام فایل عکس دقیقاً همین باشد -->
      <img src="student.png" alt="دانش آموز ریاضی" class="rounded-3xl shadow-2xl w-full max-w-sm">
    </div>
  </section>

  <!-- Grades Section -->
  <section class="max-w-7xl mx-auto px-4 py-12">
    <h3 class="text-2xl font-black mb-8">دسته‌بندی پایه‌ها</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="bg-white p-6 rounded-3xl border shadow-sm">
        <h4 class="font-black text-amber-600 mb-4">ابتدایی (دوره اول)</h4>
        <div class="space-y-2"><button class="w-full text-right py-2 px-4 bg-amber-50 rounded-xl font-bold text-amber-900">اول تا سوم</button></div>
      </div>
      <div class="bg-white p-6 rounded-3xl border shadow-sm">
        <h4 class="font-black text-emerald-600 mb-4">ابتدایی (دوره دوم)</h4>
        <div class="space-y-2"><button class="w-full text-right py-2 px-4 bg-emerald-50 rounded-xl font-bold text-emerald-900">چهارم تا ششم</button></div>
      </div>
      <div class="bg-white p-6 rounded-3xl border shadow-sm">
        <h4 class="font-black text-blue-600 mb-4">متوسطه اول</h4>
        <div class="space-y-2"><button class="w-full text-right py-2 px-4 bg-blue-50 rounded-xl font-bold text-blue-900">هفتم تا نهم</button></div>
      </div>
      <div class="bg-white p-6 rounded-3xl border shadow-sm">
        <h4 class="font-black text-purple-600 mb-4">متوسطه دوم</h4>
        <div class="space-y-2"><button class="w-full text-right py-2 px-4 bg-purple-50 rounded-xl font-bold text-purple-900">دهم تا کنکور</button></div>
      </div>
    </div>
  </section>

  <!-- Professors Section -->
  <section class="max-w-7xl mx-auto px-4 py-12">
    <h3 class="text-2xl font-black mb-8">اساتید برتر</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-3xl shadow text-center"><div class="w-20 h-20 bg-slate-200 rounded-full mx-auto mb-4"></div><h4 class="font-bold">استاد افضلی</h4><p class="text-sm text-slate-500">ریاضیات کنکور</p></div>
      <div class="bg-white p-6 rounded-3xl shadow text-center"><div class="w-20 h-20 bg-slate-200 rounded-full mx-auto mb-4"></div><h4 class="font-bold">استاد رضایی</h4><p class="text-sm text-slate-500">ریاضیات پایه</p></div>
      <div class="bg-white p-6 rounded-3xl shadow text-center"><div class="w-20 h-20 bg-slate-200 rounded-full mx-auto mb-4"></div><h4 class="font-bold">استاد امینی</h4><p class="text-sm text-slate-500">هندسه و جبر</p></div>
    </div>
  </section>

  <!-- Modals -->
  <div id="login-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full relative">
      <h3 class="text-xl font-black mb-4">ورود</h3>
      <input type="email" id="login-email" placeholder="ایمیل" class="w-full p-3 border rounded-xl mb-3">
      <input type="password" id="login-pass" placeholder="رمز عبور" class="w-full p-3 border rounded-xl mb-4">
      <button onclick="loginUser()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">ورود</button>
      <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="w-full mt-2 text-sm text-slate-400">بستن</button>
    </div>
  </div>

  <div id="signup-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full relative">
      <h3 class="text-xl font-black mb-4">ثبت‌نام</h3>
      <input type="email" id="signup-email" placeholder="ایمیل" class="w-full p-3 border rounded-xl mb-3">
      <input type="password" id="signup-pass" placeholder="رمز عبور" class="w-full p-3 border rounded-xl mb-4">
      <button onclick="registerUser()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">ثبت‌نام</button>
      <button onclick="document.getElementById('signup-modal').classList.add('hidden')" class="w-full mt-2 text-sm text-slate-400">بستن</button>
    </div>
  </div>

  <script>
    const db = supabase.createClient("https://msoovfnbkgdqxvftlkl.supabase.co", "GAPGPTMASKTOKEN2qhmlngn7m6X1X");

    async function registerUser() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-pass').value;
      const { error } = await db.auth.signUp({ email, password });
      if (error) alert(error.message); else alert('ثبت‌نام انجام شد!');
    }

    async function loginUser() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-pass').value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) alert(error.message); else { location.reload(); }
    }

    async function logout() { await db.auth.signOut(); location.reload(); }

    async function checkUser() {
      const { data: { user } } = await db.auth.getUser();
      if (user) {
        document.getElementById('auth-guest').classList.add('hidden');
        document.getElementById('auth-user').classList.remove('hidden');
        document.getElementById('user-display').innerText = user.email.split('@')[0];
      }
    }
    checkUser();
  </script>
</body>
</html>
