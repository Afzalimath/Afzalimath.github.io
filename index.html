<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        body { font-family: 'Vazirmatn', sans-serif; background: #f8fafc; }
        .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- سایدبار -->
    <aside class="w-72 p-6 gradient-bg text-white shadow-2xl m-4 rounded-3xl">
        <h1 class="text-2xl font-black mb-10 text-center">AfzaliMATH</h1>
        <div id="grade-list" class="space-y-3">
            <button onclick="renderChapters('seventh')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">هفتم ✨</button>
            <button onclick="renderChapters('eighth')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">هشتم 🚀</button>
            <button onclick="renderChapters('ninth')" class="w-full text-right p-4 rounded-2xl hover:bg-white/10 transition">نهم 💎</button>
        </div>
    </aside>

    <!-- محتوای اصلی -->
    <main class="flex-1 p-10">
        <div class="flex justify-between items-center mb-8">
            <h2 id="view-title" class="text-3xl font-bold text-slate-800">به AfzaliMATH خوش آمدید</h2>
            <button onclick="location.reload()" class="text-sm bg-slate-200 px-4 py-2 rounded-lg hover:bg-slate-300">بازگشت به خانه</button>
        </div>
        
        <div id="content-container" class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <p class="text-slate-400">یک پایه تحصیلی را انتخاب کنید تا فصل‌ها ظاهر شوند.</p>
        </div>
    </main>

    <script>
        // دیتابیس کامل ساختار درسی
        const curriculum = {
            seventh: { title: "ریاضی هفتم", chapters: 9 },
            eighth: { title: "ریاضی هشتم", chapters: 9 },
            ninth: { title: "ریاضی نهم", chapters: 8 }
        };

        // ۱. نمایش فصل‌ها
        function renderChapters(gradeKey) {
            const data = curriculum[gradeKey];
            document.getElementById('view-title').innerText = data.title + ": انتخاب فصل";
            let html = "";
            for(let i=1; i <= data.chapters; i++) {
                html += `<button onclick="renderLessons('${gradeKey}', ${i})" class="bg-white p-6 rounded-2xl shadow-lg border-b-4 border-indigo-500 hover:scale-105 transition text-center font-bold">فصل ${i}</button>`;
            }
            document.getElementById('content-container').innerHTML = html;
        }

        // ۲. نمایش درس‌ها
        function renderLessons(gradeKey, chapterNum) {
            document.getElementById('view-title').innerText = `فصل ${chapterNum}: انتخاب درس`;
            let html = "";
            for(let j=1; j <= 4; j++) {
                html += `<button onclick="showViewer('${gradeKey}', ${chapterNum}, ${j})" class="bg-white p-6 rounded-2xl shadow-lg border-b-4 border-purple-500 hover:scale-105 transition text-center font-bold">درس ${j}</button>`;
            }
            document.getElementById('content-container').innerHTML = html;
        }

        // ۳. نمایشگر محتوا (این همان بخشی است که قبلاً کار نمی‌کرد)
        function showViewer(grade, chapter, lesson) {
            document.getElementById('view-title').innerText = `${grade.toUpperCase()} | فصل ${chapter} - درس ${lesson}`;
            document.getElementById('content-container').innerHTML = `
                <div class="col-span-4 bg-white p-8 rounded-3xl shadow-2xl border-t-8 border-indigo-500">
                    <div class="flex gap-4 mb-8">
                        <button onclick="loadContent('pdf')" class="bg-indigo-500 text-white px-6 py-3 rounded-xl hover:bg-indigo-600 transition shadow-lg">📄 جزوه PDF</button>
                        <button onclick="loadContent('video')" class="bg-purple-500 text-white px-6 py-3 rounded-xl hover:bg-purple-600 transition shadow-lg">🎥 فیلم آموزشی</button>
                        <button onclick="loadContent('game')" class="bg-yellow-500 text-white px-6 py-3 rounded-xl hover:bg-yellow-600 transition shadow-lg">🎮 بازی تمرینی</button>
                    </div>
                    <div id="viewer-area" class="h-96 bg-slate-100 rounded-2xl flex items-center justify-center border-2 border-dashed border-slate-300">
                        <p class="text-slate-400">یک محتوا را برای نمایش انتخاب کنید.</p>
                    </div>
                </div>
            `;
        }

        // ۴. لودر محتوا (اینجا جایی است که فایل‌های واقعی لود می‌شوند)
        function loadContent(type) {
            const area = document.getElementById('viewer-area');
            if(type === 'pdf') area.innerHTML = "<h3>نمایش جزوه PDF (در حال آماده‌سازی فایل...)</h3>";
            if(type === 'video') area.innerHTML = "<h3>پخش‌کننده ویدیو HLS (محافظت‌شده)</h3>";
            if(type === 'game') area.innerHTML = "<h3>محیط بازی تعاملی</h3>";
        }
    </script>
</body>
</html>
