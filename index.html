<!DOCTYPE html>

  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --bg-light: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: var(--bg-light);

    header {
      background: white;

    .logo {

      font-weight: 900;

      text-decoration: none;

    /* بخش قهرمان (Hero Section) شامل تصویر دانش‌آموز */
    .hero-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .hero-text h1 {
      font-size: 44px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .hero-text h1 span {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .hero-image-box {
      position: relative;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(79, 70, 229, 0.15);
      border: 4px solid white;
    }

    .hero-image-box img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s ease;
    }

    .hero-image-box:hover img {
      transform: scale(1.03);
    }

    /* بخش پایه‌های تحصیلی */
    .main-content {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 24px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title h2 {
      font-size: 30px;
      font-weight: 900;
      color: #0f172a;
    }

    /* گرید ۱۲ پایه */
    .grades-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .grade-card {
      background: white;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
    }

    .grade-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 12px 25px rgba(79, 70, 229, 0.1);
    }

    .grade-badge {
      display: inline-block;
      width: 55px;
      height: 55px;
      line-height: 55px;
      background: #f1f5f9;
      color: var(--primary);
      font-size: 20px;
      font-weight: 900;
      border-radius: 50%;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    .grade-card:hover .grade-badge {
      background: var(--primary);
      color: white;
    }

    .grade-card h3 {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .grade-card p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* استایل کشوهای محتوایی (Accordion) */
    .grade-content-panel {
      grid-column: 1 / -1;
      background: white;
      border-radius: 20px;
      border: 2px solid var(--primary);
      padding: 30px;
      display: none; /* در ابتدا مخفی است */
      margin-top: 10px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.08);
      animation: fadeIn 0.4s ease;
    }

    .panel-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 25px;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 10px;
    }

    .sub-categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .category-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
    }

    .category-box h4 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .box-videos h4 { color: #3b82f6; }
    .box-apps h4 { color: #ec4899; }
    .box-docs h4 { color: #10b981; }

    .content-list {
      list-style: none;
    }

    .content-list li {
      margin-bottom: 8px;
    }

    .content-list a {
      font-size: 14px;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .content-list a:hover {
      color: var(--primary);
      padding-right: 4px;
    }

    footer {
      background: #0f172a;
      color: #94a3b8;
      text-align: center;
      padding: 30px 20px;
      margin-top: 80px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">

  <header>
    <a href="#" class="logo">آموزش نوین ریاضی</a>
  </header>

  <!-- هیرو اصلی حاوی تصویر دانش‌آموز شاد -->
  <section class="hero-container">
    <div class="hero-text">
      <h1><span>آموزش نوین ریاضی</span><br>لذت یادگیری از پایه تا کنکور</h1>
      <p>اینجا مفاهیم سخت ریاضی به بازی‌های ساده، ویدیوهای جذاب و شبیه‌سازهای سه‌بعدی تبدیل می‌شوند تا یادگیری شیرین‌تر از همیشه باشد.</p>
    </div>
    <div class="hero-image-box">
      <!-- اگر عکس را آپلود کردید، نام فایلش را در زیر جایگزین کنید -->
      <img src="student.png" alt="یادگیری شاد ریاضی">
    </div>
  </section>

  <main class="main-content">
    <div class="section-title">
      <h2>پایه‌ی تحصیلی خود را انتخاب کنید</h2>
    </div>

    <div class="grades-grid">
      <!-- پایه‌های ۱ تا ۱۲ -->
      <script>
        const grades = [
          "اول ابتدایی", "دوم ابتدایی", "سوم ابتدایی", 
          "چهارم ابتدایی", "پنجم ابتدایی", "ششم ابتدایی", 
          "هفتم دوره اول", "هشتم دوره اول", "نهم دوره اول", 
          "دهم متوسطه دوم", "یازدهم متوسطه دوم", "دوازدهم متوسطه دوم"
        ];
        
        grades.forEach((grade, index) => {
          document.write(`
            <div class="grade-card" onclick="toggleGradePanel(${index + 1})">
              <div class="grade-badge">${index + 1}</div>
              <h3>پایه ${grade}</h3>
              <p>فیلم، اپلیکیشن، بازی و جزوات تخصصی</p>
            </div>
            
            <div class="grade-content-panel" id="panel-grade-${index + 1}">
              <div class="panel-title">📚 محتوای اختصاصی پایه ${grade}</div>
              <div class="sub-categories">
                
                <div class="category-box box-videos">
                  <h4>🎬 فیلم‌های آموزشی</h4>
                  <ul class="content-list">
                    <li><a href="#">🎥 فیلم تدریس مفهوم درس اول</a></li>
                    <li><a href="#">🎥 ویدیو حل تمرین‌های کلیدی</a></li>
                  </ul>
                </div>
                
                <div class="category-box box-apps">
                  <h4>🎮 اپلیکیشن و بازی</h4>
                  <ul class="content-list">
                    <li><a href="#">📱 شبیه‌ساز ریاضی تعاملی</a></li>
                    <li><a href="#">🕹️ بازی ریاضی و تمرین مبحث</a></li>
                  </ul>
                </div>
                
                <div class="category-box box-docs">
                  <h4>📄 جزوه و نمونه سوال</h4>
                  <ul class="content-list">
                    <li><a href="#">📝 خلاصه فرمول‌ها و نکات کلیدی</a></li>
                    <li><a href="#">📄 نمونه سوالات امتحانی نوبت اول و دوم</a></li>
                  </ul>
                </div>

              </div>
            </div>
          `);
        });

        function toggleGradePanel(gradeId) {
          // بستن بقیه پنل‌ها در صورت تمایل، یا باز ماندن همزمان
          const allPanels = document.querySelectorAll('.grade-content-panel');
          allPanels.forEach(panel => {
            if (panel.id !== 'panel-grade-' + gradeId) {
              panel.style.display = 'none';
            }
          });

          const activePanel = document.getElementById('panel-grade-' + gradeId);
          if (activePanel.style.display === 'block') {
            activePanel.style.display = 'none';
          } else {
            activePanel.style.display = 'block';
            activePanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      </script>
    </div>
  </main>

  <footer>
    <p>تمامی حقوق برای آکادمی آموزش نوین ریاضی محفوظ است ©</p>
  </footer>

  <script>
    document.addEventListener('keydown', function (e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'p' || e.key === 'a'))
      ) {
        e.preventDefault();
        return false;
      }
    });
  </script>
</body>
